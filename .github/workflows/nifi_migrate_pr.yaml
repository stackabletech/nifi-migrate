---
name: Build nifi-migrate

on:
  pull_request:
    paths:
      - ".github/workflows/nifi_migrate_pr.yaml"
      - "rust-toolchain.toml"
      - "src/**.rs"
      - "Cargo.*"

env:
  RUST_VERSION: 1.87.0

permissions: {}

jobs:
  # This job is always run to ensure we don't miss any new upstream advisories
  cargo-deny:
    name: Run cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Prevent sudden announcement of a new advisory from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  build:
    name: Build nifi-migrate
    needs:
      - cargo-deny
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        targets:
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.targets.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.targets.target }}

      - name: Build Binary
        run: cargo build --target ${{ matrix.targets.target }} --package nifi-migrate
