[package]
name = "nifi-migrate"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Stackable GmbH <info@stackable.tech>"]
description = "A CLI tool for migrating Apache NiFi flow.json files between versions"
repository = "https://github.com/stackabletech/nifi-migrate"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
